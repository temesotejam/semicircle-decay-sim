name: STEP compliance audit

on:
  push:
    paths:
      - 'analysis/evaluate_step_cantilever_compliance.py'
      - 'model/step_cantilever_compliance.py'
      - 'model/rocker_geometry.py'
      - 'data/processed/v61_run2_free_decay_peak_zero_pairs.csv'
      - 'data/processed/manual_release_periods_20260828.csv'
      - '.github/workflows/step-compliance-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run STEP compliance historical-data audit
        run: python analysis/evaluate_step_cantilever_compliance.py
