name: Fix dynamic support constructor

on:
  push:
    paths:
      - '.github/workflows/fix-dynamic-support-constructor.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix keyword construction and push
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('analysis/evaluate_dynamic_support_transfer.py')
          s = p.read_text()
          s = s.replace('DynamicSupportTransfer(math.radians(start_deg), tau_s)', 'DynamicSupportTransfer(transfer_start_rad=math.radians(start_deg), transfer_tau_s=tau_s)')
          s = s.replace('DynamicSupportTransfer(0.0, 0.0)', 'DynamicSupportTransfer(transfer_start_rad=0.0, transfer_tau_s=0.0)')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis/evaluate_dynamic_support_transfer.py
          git commit -m 'Fix dynamic support model construction'
          git push
