name: Assemble STEP source

on:
  push:
    paths:
      - '.github/workflows/assemble-step-source.yml'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct STEP file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cad
          cat \
            .upload/part_step_xz_b64_00 \
            .upload/part_step_xz_b64_01 \
            .upload/part_step_xz_b64_02 \
            .upload/part_step_xz_b64_03 > /tmp/Part_Studio_1.1.step.xz.b64
          base64 -d /tmp/Part_Studio_1.1.step.xz.b64 > /tmp/Part_Studio_1.1.step.xz
          xz -d -c /tmp/Part_Studio_1.1.step.xz > cad/Part_Studio_1.1.step
          echo 'e268a25352145499ac5eb2602f635f547d3d6581199b257ca2c1f72aba44f4c8  cad/Part_Studio_1.1.step' | sha256sum -c -
          test "$(wc -c < cad/Part_Studio_1.1.step)" -eq 249043

      - name: Commit source STEP and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upload
          rm .github/workflows/assemble-step-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add source STEP geometry'
          git push
