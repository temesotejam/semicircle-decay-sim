name: Dynamic support-transfer audit

on:
  push:
    paths:
      - 'analysis/evaluate_dynamic_support_transfer.py'
      - 'model/dynamic_support_transfer.py'
      - 'model/rocker_geometry.py'
      - 'data/processed/v61_run2_free_decay_peak_zero_pairs.csv'
      - 'data/processed/manual_release_periods_20260828.csv'
      - '.github/workflows/dynamic-support-transfer-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run dynamic support-transfer audit
        run: python analysis/evaluate_dynamic_support_transfer.py
